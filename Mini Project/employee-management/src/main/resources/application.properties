spring.application.name=employee-management
server.port=8080

# Module 7: dev mac dinh; su dung SPRING_PROFILES_ACTIVE=prod khi deploy.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Tai khoan demo chi dung de hoc tren may local.
# Khi chay prod, application-prod.yml buoc nhap ADMIN_USERNAME/ADMIN_PASSWORD.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Actuator: health cong khai, metrics chi Admin xem sau khi dang nhap
management.endpoints.web.exposure.include=health,metrics

# JWT: sinh khoa ngau nhien cho dev neu chua dat bien moi truong
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
