spring.application.name=employee-management
server.port=8080
# Lesson 4: Application Properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
# Account demo ONLY, change these before using outside local machine
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
