spring:
  datasource:
    url: '${DB_URL}'
    username: '${DB_USERNAME}'
    password: '${DB_PASSWORD}'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  thymeleaf:
    cache: true

# Khong de mat khau demo khi chay production.
app:
  admin:
    username: '${ADMIN_USERNAME}'
    password: '${ADMIN_PASSWORD}'

logging:
  level:
    com.example.employeemanagement: INFO
